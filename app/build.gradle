apply plugin: 'com.android.application'

def freenetVersion = '0.2.154'

android {
    namespace 'org.freenetproject.mobile'
    compileSdk 35
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        buildConfig true
    }
    defaultConfig {
        // Non e' l'app ufficiale: un id diverso evita di confonderla con quella vecchia
        applicationId "local.freenet.mobile"
        minSdk 26
        targetSdk 34
        versionCode 400
        versionName "0.4.0-freenet-$freenetVersion"
        buildConfigField "String", "FREENET_VERSION", "\"$freenetVersion\""

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        setProperty("archivesBaseName", "freenet-mobile-v$versionName")
    }

    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a', 'x86_64'
            universalApk false
        }
    }

    packaging {
        jniLibs {
            // Android esegue solo programmi nella cartella delle librerie estratte
            useLegacyPackaging true
            keepDebugSymbols += ['**/libfreenet.so', '**/libfdev.so']
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'androidx.navigation:navigation-fragment:2.8.5'
    implementation 'androidx.navigation:navigation-ui:2.8.5'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.8.7'
    implementation 'androidx.preference:preference:1.2.1'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
