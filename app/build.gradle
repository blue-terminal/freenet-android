apply plugin: 'com.android.application'

def freenetVersion = '0.2.154'

android {
    namespace 'org.freenetproject.mobile'
    compileSdk 35
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        buildConfig true
    }
    defaultConfig {
        // Non e' l'app ufficiale: un id diverso evita di confonderla con quella vecchia
        applicationId "local.freenet.mobile"
        minSdk 26
        targetSdk 34
        versionCode 1820
        versionName "1.8.2-freenet-$freenetVersion"
        buildConfigField "String", "FREENET_VERSION", "\"$freenetVersion\""

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        setProperty("archivesBaseName", "freenet-mobile-v$versionName")
    }

    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a', 'x86_64'
            universalApk false
        }
    }

    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*']
        }
        jniLibs {
            // Android esegue solo programmi nella cartella delle librerie estratte
            useLegacyPackaging true
            keepDebugSymbols += ['**/libfreenet.so', '**/libfdev.so', '**/libghostkey.so']
        }
    }

    // The key stays outside the repository. Without it the build uses the debug key.
    def signingFile = new File(System.getProperty('user.home'), '.config/freenet-android/firma.properties')
    if (signingFile.exists()) {
        def signing = new Properties()
        signingFile.withInputStream { signing.load(it) }
        signingConfigs {
            own {
                storeFile new File(signingFile.parentFile, 'firma.jks')
                storePassword signing.storePassword
                keyAlias signing.keyAlias
                keyPassword signing.storePassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingFile.exists() ? signingConfigs.own : signingConfigs.debug
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'androidx.navigation:navigation-fragment:2.8.5'
    implementation 'androidx.navigation:navigation-ui:2.8.5'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.8.7'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    implementation 'androidx.work:work-runtime:2.9.1'
    // SSH server for the PC: only forwards the node's port, no shell, no files.
    implementation 'org.apache.sshd:sshd-core:2.14.0'
    implementation 'org.slf4j:slf4j-nop:1.7.36'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}

// The app's own name lives outside the repository, next to the signing key: the pages and texts in
// the repository call it "Web Open Source" followed by an invisible WORD JOINER, and the build puts
// the name from ~/.config/freenet-android/nome.properties (nome=...) in its place. Without the
// file the app is called "Web Open Source".
def brandFile = new File(System.getProperty('user.home'), '.config/freenet-android/nome.properties')
def brandName = 'Web Open Source'
if (brandFile.exists()) {
    def brandProps = new Properties()
    brandFile.withReader('UTF-8') { brandProps.load(it) }
    brandName = brandProps.getProperty('nome', brandName).trim()
}
def brandMark = '\u2060'
def brandOut = layout.buildDirectory.dir('brand')
def brandTask = tasks.register('brandSources', Sync) {
    from('src/main') {
        include 'assets/**'
        include 'res/**'
    }
    into brandOut
    inputs.property('brandName', brandName)
    filteringCharset = 'UTF-8'
    filesMatching(['**/*.html', '**/*.js', '**/*.css', '**/*.xml']) {
        filter { String line -> line.replace('Web Open Source' + brandMark, brandName).replace('WEB OPEN SOURCE' + brandMark, brandName.toUpperCase()) }
    }
}
android.sourceSets.main.assets.srcDirs = [brandOut.get().dir('assets').asFile]
android.sourceSets.main.res.srcDirs = [brandOut.get().dir('res').asFile]
tasks.named('preBuild').configure { dependsOn brandTask }

