apply plugin: 'com.android.application'

def freenetVersion = '0.2.154'

android {
    namespace 'org.freenetproject.mobile'
    compileSdk 35
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        buildConfig true
    }
    defaultConfig {
        // Non e' l'app ufficiale: un id diverso evita di confonderla con quella vecchia
        applicationId "local.freenet.mobile"
        minSdk 26
        targetSdk 34
        versionCode 1720
        versionName "1.7.2-freenet-$freenetVersion"
        buildConfigField "String", "FREENET_VERSION", "\"$freenetVersion\""

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        setProperty("archivesBaseName", "freenet-mobile-v$versionName")
    }

    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a', 'x86_64'
            universalApk false
        }
    }

    packaging {
        jniLibs {
            // Android esegue solo programmi nella cartella delle librerie estratte
            useLegacyPackaging true
            keepDebugSymbols += ['**/libfreenet.so', '**/libfdev.so', '**/libghostkey.so']
        }
    }

    // The key stays outside the repository. Without it the build uses the debug key.
    def signingFile = new File(System.getProperty('user.home'), '.config/freenet-android/firma.properties')
    if (signingFile.exists()) {
        def signing = new Properties()
        signingFile.withInputStream { signing.load(it) }
        signingConfigs {
            own {
                storeFile new File(signingFile.parentFile, 'firma.jks')
                storePassword signing.storePassword
                keyAlias signing.keyAlias
                keyPassword signing.storePassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingFile.exists() ? signingConfigs.own : signingConfigs.debug
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'androidx.navigation:navigation-fragment:2.8.5'
    implementation 'androidx.navigation:navigation-ui:2.8.5'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.8.7'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    implementation 'androidx.work:work-runtime:2.9.1'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
