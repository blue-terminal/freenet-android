<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Web 7.0 — Connessione</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--green:#2ea44f;--green2:#3fb95f;--bg:#0d1117;--bg2:#161b22;--text:#f0f6fc;--text2:#8b949e}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;
  min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden}

.bg-anim{position:fixed;inset:0;z-index:0;overflow:hidden}
.bg-anim span{position:absolute;border-radius:50%;filter:blur(80px);opacity:.18;animation:drift 8s infinite alternate ease-in-out}
.bg-anim span:nth-child(1){width:400px;height:400px;background:#2ea44f;top:-100px;left:-100px;animation-delay:0s}
.bg-anim span:nth-child(2){width:300px;height:300px;background:#1a7f37;bottom:-80px;right:-80px;animation-delay:-3s}
.bg-anim span:nth-child(3){width:200px;height:200px;background:#238636;top:50%;left:60%;animation-delay:-5s}
@keyframes drift{0%{transform:translate(0,0) scale(1)}100%{transform:translate(30px,20px) scale(1.1)}}

.card{position:relative;z-index:1;text-align:center;padding:48px 32px;max-width:380px;width:90%}

.logo-wrap{display:inline-flex;align-items:center;gap:12px;margin-bottom:12px}
.logo-icon{width:56px;height:56px;background:var(--green);border-radius:16px;
  display:flex;align-items:center;justify-content:center;font-size:28px;
  box-shadow:0 0 32px rgba(46,164,79,.5)}
.logo-text{font-size:32px;font-weight:700;letter-spacing:-1px}
.logo-text sup{font-size:16px;color:var(--green);font-weight:600;vertical-align:super}

.datetime{font-size:13px;color:var(--text2);margin-bottom:32px;letter-spacing:.02em}

/* spinner ad anelli concentrici */
.spinner-wrap{position:relative;width:120px;height:120px;margin:0 auto 32px}
.spinner-wrap svg{position:absolute;inset:0;width:100%;height:100%}
.ring1{fill:none;stroke:rgba(46,164,79,.15);stroke-width:6}
.ring2{fill:none;stroke:var(--green);stroke-width:6;stroke-linecap:round;
  stroke-dasharray:220;stroke-dashoffset:60;animation:spin1 1.4s linear infinite}
.ring3{fill:none;stroke:rgba(63,185,80,.4);stroke-width:3;stroke-linecap:round;
  stroke-dasharray:120;stroke-dashoffset:30;animation:spin2 2.1s linear infinite reverse}
@keyframes spin1{to{stroke-dashoffset:280;transform-origin:50% 50%;}}
@keyframes spin2{to{stroke-dashoffset:-120;transform-origin:50% 50%;}}
.spinner-icon{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:36px}

.status{font-size:14px;color:var(--text2);margin-bottom:8px;min-height:22px}
.dot{display:inline-block;animation:blink 1.2s infinite}
.dot:nth-child(2){animation-delay:.2s}
.dot:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:0}40%{opacity:1}}

.node-found{display:none;margin:12px 0;padding:10px 18px;border-radius:10px;
  background:rgba(63,185,80,.12);border:1px solid rgba(63,185,80,.3);
  color:#3fb950;font-size:14px;font-weight:600}
.node-found.show{display:block;animation:pop .3s ease}
@keyframes pop{0%{transform:scale(.9);opacity:0}100%{transform:scale(1);opacity:1}}

.btn-open{display:none;margin-top:20px;padding:16px 40px;border-radius:10px;
  background:var(--green);color:#fff;font-size:16px;font-weight:700;
  border:none;cursor:pointer;width:100%;transition:background .2s;letter-spacing:.02em}
.btn-open:hover{background:var(--green2)}
.btn-open.show{display:block;animation:pop .3s ease}

.skip-hint{font-size:11px;color:rgba(255,255,255,.18);margin-top:20px;cursor:pointer}
</style>
</head>
<body>
<div class="bg-anim"><span></span><span></span><span></span></div>
<div class="card">
  <div class="logo-wrap">
    <div class="logo-icon">🌐</div>
    <div class="logo-text">Web 7.0<sup>β</sup></div>
  </div>
  <div class="datetime" id="dt"></div>

  <div class="spinner-wrap">
    <svg viewBox="0 0 120 120">
      <circle class="ring1" cx="60" cy="60" r="50"/>
      <circle class="ring2" cx="60" cy="60" r="50"/>
      <circle class="ring3" cx="60" cy="60" r="38"/>
    </svg>
    <div class="spinner-icon">🌐</div>
  </div>

  <div class="status" id="status">
    Connessione a Freenet<span class="dot">.</span><span class="dot">.</span><span class="dot">.</span>
  </div>

  <div id="nodeFound" class="node-found"></div>
  <button class="btn-open" id="btn-open" onclick="openWeb7()">🚀 Apri Web 7.0</button>

  <p class="skip-hint" onclick="openWeb7()">Apri senza nodo →</p>
</div>

<script>
const LOCAL_NODES = ['http://127.0.0.1:7509', 'http://127.0.0.1:8888'];
let nodeUrl = null;
let done = false;
let attempts = 0;
const MAX_ATTEMPTS = 2; // 2 tentativi: 500ms + 1.5s = ~2s poi apre Web 7.0 offline

const stEl  = document.getElementById('status');
const btnO  = document.getElementById('btn-open');
const nfEl  = document.getElementById('nodeFound');
const dtEl  = document.getElementById('dt');

// data e ora aggiornate ogni secondo
function updateClock() {
  const now = new Date();
  const d = now.toLocaleDateString('it-IT', {weekday:'short',day:'2-digit',month:'short',year:'numeric'});
  const t = now.toLocaleTimeString('it-IT');
  dtEl.textContent = d + ' · ' + t;
}
updateClock();
setInterval(updateClock, 1000);

async function detectNode(timeoutMs) {
  const to = timeoutMs || 1500;
  for (const base of LOCAL_NODES) {
    try {
      const ctrl = new AbortController();
      const t = setTimeout(() => ctrl.abort(), to);
      const r = await fetch(base + '/v1/version', { signal: ctrl.signal });
      clearTimeout(t);
      if (r.ok) return base;
    } catch {}
  }
  let remIp = null;
  try { remIp = localStorage.getItem('fn_remote_node'); } catch {}
  if (remIp) {
    const base = 'http://' + remIp + ':7509';
    try {
      const ctrl = new AbortController();
      const t = setTimeout(() => ctrl.abort(), to);
      const r = await fetch(base + '/v1/version', { signal: ctrl.signal });
      clearTimeout(t);
      if (r.ok) return base;
    } catch {}
  }
  return null;
}

function openWeb7() {
  if (done) return;
  done = true;
  // Se trovato su LAN (non 127.0.0.1), salva IP per Web 7.0
  if (nodeUrl && !nodeUrl.includes('127.0.0.1') && !nodeUrl.includes('localhost')) {
    const ip = nodeUrl.replace(/^https?:\/\//, '').split(':')[0];
    try { localStorage.setItem('fn_remote_node', ip); } catch {}
  }
  // Web 7.0 bundlato nell'APK — funziona sempre
  window.location.href = 'file:///android_asset/index.html';
}

async function tryConnect() {
  // Prima verifica veloce (500ms per nodo) — se il nodo è già su, apre subito
  const found = await detectNode(attempts === 1 ? 500 : 1500);
  if (found) {
    nodeUrl = found;
    nfEl.textContent = '✓ Nodo Freenet attivo — ' + found.replace('http://', '');
    nfEl.classList.add('show');
    stEl.textContent = 'Connesso!';
    btnO.classList.add('show');
    openWeb7(); // apre subito, senza attesa
    return;
  }
  attempts++;
  const statusMsgs = [
    'Connessione a Freenet',
    'Ricerca nodi peer',
    'Verifica rete locale',
    'Sincronizzazione routing',
    'Caricamento contratti',
    'Quasi pronto',
  ];
  const idx = Math.min(Math.floor(attempts / 5), statusMsgs.length - 1);
  stEl.innerHTML = statusMsgs[idx]
    + '<span class="dot">.</span><span class="dot">.</span><span class="dot">.</span>';
  if (attempts >= MAX_ATTEMPTS) {
    stEl.textContent = 'Nodo non trovato';
    nfEl.textContent = '⚠ Avvia il nodo Freenet e riprova';
    nfEl.style.borderColor = 'rgba(255,100,50,.3)';
    nfEl.style.background  = 'rgba(255,100,50,.1)';
    nfEl.style.color = '#ff6432';
    nfEl.classList.add('show');
    btnO.textContent = 'Vai alla pagina di configurazione';
    btnO.classList.add('show');
    return;
  }
  setTimeout(tryConnect, 2000);
}

// Doppio tap per saltare
let lastTap = 0;
document.body.addEventListener('touchend', () => {
  const now = Date.now();
  if (now - lastTap < 400) openWeb7();
  lastTap = now;
});

tryConnect();
</script>
</body>
</html>
