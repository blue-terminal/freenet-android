[package]
name = "web70-hub"
version = "0.1.0"
edition = "2021"

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
freenet-stdlib = { version = "=0.12.1", features = ["contract"] }
serde_json = "1"
sha2 = "0.10"
p256 = { version = "0.13", default-features = false, features = ["ecdsa"] }
base64ct = { version = "1", features = ["alloc"] }

[features]
default = ["freenet-main-contract"]
freenet-main-contract = []

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
